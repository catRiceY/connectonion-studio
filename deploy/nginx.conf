pid /tmp/studio-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Some legacy lifecycle / WebSocket routes have no API-level local guard.
    # Apply the same browser-origin boundary to every route at this gateway.
    map $http_origin $studio_origin {
        default $http_origin;
        '' "$scheme://$http_host";
    }
    map $http_sec_fetch_site $studio_fetch_allowed {
        default 0;
        '' 1;
        none 1;
        same-origin 1;
    }
    server {
        listen 8080;
        server_name localhost 127.0.0.1;
        # This is a local development deployment, never a public gateway.
        if ($host !~ ^(localhost|127\.0\.0\.1)$) { return 403; }
        if ($studio_origin != "$scheme://$http_host") { return 403; }
        if ($studio_fetch_allowed = 0) { return 403; }
        client_max_body_size 1m;
        location / {
            proxy_pass http://127.0.0.1:9900;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For 127.0.0.1;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 90s;
        }
    }
}
