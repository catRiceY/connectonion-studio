[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "connectonion-studio"
version = "0.1.8"
description = "ConnectOnion Studio — local test cockpit for ConnectOnion agents: create, run, QR, live logs, Copy-for-Claude diagnostics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EvanYifanYang", email = "209575631+EvanYifanYang@users.noreply.github.com" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "segno>=1.6",
    "pydantic>=2",          # request models (was only transitive via fastapi)
    "ifaddr>=0.2",          # agent IP announce patch (was only transitive)
    "psutil>=5.9",          # cross-platform process teardown / liveness (Windows-safe)
    "filelock>=3.12",       # cross-platform registry lock (replaces POSIX-only fcntl)
    "pyyaml>=6",            # parse SKILL.md frontmatter for the skills store (also a connectonion dep)
    "connectonion==1.9.2", # Studio adapters are tested against this stable release
    "websockets>=15.0.1,<18", # asyncio transport with system HTTP/SOCKS proxy support
    "python-socks[asyncio]>=2.4,<3", # websockets relay honors the user's system SOCKS proxy
]

classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[project.optional-dependencies]
history = ["psycopg[binary]>=3.2,<4"]
mcp = ["mcp>=1.20,<2", "jsonschema>=4.20,<5"]
knowledge = ["psycopg[binary]>=3.2,<4", "fastembed>=0.7,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/catRiceY/connectonion-studio"
Repository = "https://github.com/catRiceY/connectonion-studio"
Issues = "https://github.com/catRiceY/connectonion-studio/issues"

[project.scripts]
co-studio = "co_studio.__main__:main"
co-studio-history = "co_studio.history_archive:main"

[tool.setuptools.packages.find]
include = ["co_studio*"]

[tool.setuptools.package-data]
co_studio = [
    "templates/*.tmpl",
    "frontend/index.html",
    "frontend/css/*.css",
    "frontend/js/*.js",
    "frontend/assets/onion/*.png",
    "skills/*/SKILL.md",
    "knowledge_docs/*.md",
]
